<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — BEATLAB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">BEATLAB®</div>
        <nav class="nav-links">
            <a href="/">Главная</a>
            <a href="/library.html">Библиотека</a>
            <a href="/studio.html">Студия</a>
            <a href="/contacts.html">Контакты</a>
        </nav>
        <div class="nav-auth">
            <a href="/register.html" class="btn-dark">Регистрация</a>
        </div>
    </header>

    <section class="auth-form">
        <h2>LOG IN</h2>
        <p class="subtitle">Войдите в свой аккаунт</p>

        <form id="loginForm">
            <label>Имя пользователя</label>
            <input type="text" id="loginUsername" required placeholder="Ваш логин">

            <label>Пароль</label>
            <input type="password" id="loginPassword" required placeholder="Ваш пароль">

            <button type="submit" class="btn-primary">Войти</button>
        </form>

        <p class="switch-link">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
    </section>

    <script src="/js/main.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
