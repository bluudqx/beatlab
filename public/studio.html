<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студия — BEATLAB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        .studio-container { padding: 50px; max-width: 1200px; margin: 0 auto; }
        .studio-title { font-size: 60px; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; line-height: 1; margin-bottom: 20px; color: var(--text-white); }
        .control-group { margin-bottom: 30px; }
        .control-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-gray); margin-bottom: 10px; }
        .control-group input[type="text"], .control-group select { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-white); font-family: 'Inter', sans-serif; font-size: 16px; }
        .bpm-slider { width: 100%; -webkit-appearance: none; height: 4px; background: #333; border-radius: 2px; outline: none; margin-top: 15px; }
        .bpm-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--text-white); border-radius: 50%; cursor: pointer; }
        .bpm-value { font-size: 36px; font-weight: 900; margin-top: 10px; display: block; color: var(--text-white); }

        .timeline-section { margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--border-color); }
        .mixer-title { font-size: 24px; text-transform: uppercase; font-weight: 900; margin-bottom: 30px; color: var(--text-white); }
        .timeline-container { display: flex; background: #111; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; position: relative; }
        .track-headers { width: 120px; display: flex; flex-direction: column; background: #1a1a1a; border-right: 1px solid var(--border-color); z-index: 10; }
        .track-header { height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; border-bottom: 1px solid var(--border-color); font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-white); }
        .track-header:last-child { border-bottom: none; }
        .timeline-grid { flex: 1; display: flex; flex-direction: column; position: relative; overflow-x: auto; }
        .timeline-row { height: 60px; display: flex; border-bottom: 1px solid var(--border-color); position: relative; }
        .timeline-row:last-child { border-bottom: none; }
        .timeline-cell { flex: 1; min-width: 40px; border-right: 1px solid #222; cursor: pointer; transition: background 0.1s; }
        .timeline-cell:hover { background: #222; }
        .timeline-block { position: absolute; height: 40px; top: 10px; background: var(--text-white); border-radius: 4px; cursor: grab; display: flex; align-items: center; justify-content: space-between; font-size: 10px; font-weight: 900; color: var(--text-black); z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5); padding: 0 5px 0 10px; user-select: none; }
        .timeline-block:active { cursor: grabbing; }
        .block-resize { width: 8px; height: 100%; cursor: ew-resize; background: rgba(0,0,0,0.2); border-radius: 0 4px 4px 0; position: absolute; right: 0; top: 0; }
        .block-resize:hover { background: rgba(0,0,0,0.4); }
        .block-delete { background: rgba(255, 0, 0, 0.8); color: white; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 15; opacity: 0; transition: opacity 0.2s; }
        .timeline-block:hover .block-delete { opacity: 1; }
        .block-delete:hover { background: red; }
        .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff3b3b; z-index: 20; pointer-events: none; transition: left 0.05s linear; }

        .btn-group { display: flex; gap: 20px; margin-top: 30px; }
        .play-btn, .save-btn { flex: 1; padding: 20px; border-radius: 50px; font-weight: 900; font-size: 14px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; border: none; }
        .play-btn { background: transparent; color: var(--text-white); border: 1px solid var(--border-color); }
        .play-btn:hover { border-color: var(--text-white); }
        .play-btn.playing { background: #ff3b3b; color: white; border-color: #ff3b3b; }
        .save-btn { background: var(--text-white); color: var(--text-black); }
        .save-btn:hover { transform: scale(1.02); }
        .mute-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-gray); padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; transition: all 0.2s; }
        .mute-btn.muted { background: #ff3b3b; color: white; border-color: #ff3b3b; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">BEATLAB®</div>
        <nav class="nav-links">
            <a href="/">Главная</a>
            <a href="/library.html">Библиотека</a>
            <a href="/studio.html" style="color: var(--text-gray);">Студия</a>
            <a href="/about.html">О проекте</a>
            <a href="/contacts.html">Контакты</a>
        </nav>
        <div class="nav-auth">
            <a href="/login.html" class="link-login">Войти</a>
            <a href="/register.html" class="btn-dark">Регистрация</a>
        </div>
    </header>

    <section class="studio-container">
        <h1 class="studio-title">CREATE<br>YOUR BEAT</h1>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px;">
            <div>
                <div class="control-group">
                    <label>Название бита</label>
                    <input type="text" id="beatName" placeholder="Например: My First Trap Beat">
                </div>
                <div class="control-group">
                    <label>Жанр</label>
                    <select id="beatGenre">
                        <option value="Trap">Trap</option>
                        <option value="Hip-Hop">Hip-Hop</option>
                        <option value="Lo-Fi">Lo-Fi</option>
                        <option value="House">House</option>
                    </select>
                </div>
            </div>
            <div>
                <div class="control-group">
                    <label>BPM (Темп)</label>
                    <span class="bpm-value" id="bpmDisplay">120</span>
                    <input type="range" class="bpm-slider" id="bpmSlider" min="60" max="180" value="120">
                </div>
            </div>
        </div>

        <div class="timeline-section">
            <h2 class="mixer-title">TIMELINE / СВЕДЕНИЕ</h2>
            <div class="timeline-container">
                <div class="track-headers" id="trackHeaders"></div>
                <div class="timeline-grid" id="timelineGrid"></div>
            </div>
        </div>

        <div class="btn-group">
            <button class="play-btn" id="playBtn">▶ ПРОСЛУШАТЬ</button>
            <button class="save-btn" id="saveBeatBtn">Сохранить бит</button>
        </div>
    </section>

    <script>
        const tracks = [
            { id: 'kick', name: 'KICK' },
            { id: 'snare', name: 'SNARE' },
            { id: 'hihat', name: 'HI-HAT' },
            { id: 'bass', name: 'BASS' },
            { id: 'melody', name: 'MELODY' }
        ];

        let patterns = {
            kick: [{ start: 0, length: 1 }, { start: 4, length: 1 }, { start: 8, length: 1 }, { start: 12, length: 1 }],
            snare: [{ start: 4, length: 1 }, { start: 12, length: 1 }],
            hihat: [{ start: 0, length: 1 }, { start: 2, length: 1 }, { start: 4, length: 1 }, { start: 6, length: 1 }, { start: 8, length: 1 }, { start: 10, length: 1 }, { start: 12, length: 1 }, { start: 14, length: 1 }],
            bass: [{ start: 0, length: 4 }, { start: 8, length: 4 }],
            melody: [{ start: 0, length: 8 }]
        };

        let audioCtx = null;
        let isPlaying = false;
        let currentTime = 0;
        let timerID = null;
        let tempo = 120;
        let totalSteps = 16;
        let volumes = { kick: 1, snare: 0.8, hihat: 0.5, bass: 0.7, melody: 0.6 };
        let muted = { kick: false, snare: false, hihat: false, bass: false, melody: false };

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type, time) {
            if (muted[type]) return;
            const vol = volumes[type];
            
            if (type === 'kick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
                gain.gain.setValueAtTime(1 * vol, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
                osc.start(time); osc.stop(time + 0.5);
            } 
            else if (type === 'snare') {
                const bufferSize = audioCtx.sampleRate * 0.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = 1000;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5 * vol, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(time);
            }
            else if (type === 'hihat') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(10000, time);
                gain.gain.setValueAtTime(0.1 * vol, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time); osc.stop(time + 0.1);
            }
            else if (type === 'bass') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(60, time);
                gain.gain.setValueAtTime(0.5 * vol, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time); osc.stop(time + 0.3);
            }
            else if (type === 'melody') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(440, time);
                gain.gain.setValueAtTime(0.3 * vol, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time); osc.stop(time + 1);
            }
        }

        const trackHeaders = document.getElementById('trackHeaders');
        const timelineGrid = document.getElementById('timelineGrid');

        function buildInterface() {
            trackHeaders.innerHTML = '';
            timelineGrid.innerHTML = '';

            tracks.forEach(track => {
                const header = document.createElement('div');
                header.className = 'track-header';
                header.innerHTML = `
                    <span>${track.name}</span>
                    <button class="mute-btn" data-track="${track.id}">MUTE</button>
                `;
                header.querySelector('.mute-btn').addEventListener('click', (e) => {
                    muted[track.id] = !muted[track.id];
                    e.target.classList.toggle('muted', muted[track.id]);
                    e.target.textContent = muted[track.id] ? 'UNMUTE' : 'MUTE';
                });
                trackHeaders.appendChild(header);

                const row = document.createElement('div');
                row.className = 'timeline-row';
                row.dataset.track = track.id;

                for (let i = 0; i < totalSteps; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'timeline-cell';
                    cell.dataset.step = i;
                    cell.addEventListener('click', () => {
                        const exists = patterns[track.id].find(p => p.start === i);
                        if (!exists) {
                            const len = (track.id === 'melody' || track.id === 'bass') ? 4 : 1;
                            patterns[track.id].push({ start: i, length: len });
                            renderBlocks(track.id);
                        }
                    });
                    row.appendChild(cell);
                }
                timelineGrid.appendChild(row);
            });

            const playhead = document.createElement('div');
            playhead.className = 'playhead';
            playhead.id = 'playhead';
            timelineGrid.appendChild(playhead);

            tracks.forEach(t => renderBlocks(t.id));
        }

        function renderBlocks(trackId) {
            const row = document.querySelector(`.timeline-row[data-track="${trackId}"]`);
            row.querySelectorAll('.timeline-block').forEach(b => b.remove());
            
            const cellWidthPercent = 100 / totalSteps;
            const pattern = patterns[trackId];

            pattern.forEach((block, index) => {
                const blockEl = document.createElement('div');
                blockEl.className = 'timeline-block';
                blockEl.style.left = `${block.start * cellWidthPercent}%`;
                blockEl.style.width = `${block.length * cellWidthPercent}%`;
                blockEl.dataset.index = index;
                blockEl.dataset.track = trackId;
                
                const textNode = document.createElement('span');
                textNode.textContent = trackId.toUpperCase();
                blockEl.appendChild(textNode);

                const delBtn = document.createElement('div');
                delBtn.className = 'block-delete';
                delBtn.textContent = '×';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    patterns[trackId] = patterns[trackId].filter((_, i) => i !== index);
                    renderBlocks(trackId);
                });
                blockEl.appendChild(delBtn);

                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'block-resize';
                blockEl.appendChild(resizeHandle);

                blockEl.draggable = true;
                blockEl.addEventListener('dragstart', (e) => {
                    if (e.target.classList.contains('block-resize')) {
                        e.preventDefault();
                        return;
                    }
                    e.dataTransfer.setData('text/plain', index);
                    e.dataTransfer.setData('track', trackId);
                });

                resizeHandle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const startX = e.clientX;
                    const startWidth = blockEl.offsetWidth;
                    const rowWidth = row.offsetWidth;

                    function onMouseMove(moveEvent) {
                        const deltaX = moveEvent.clientX - startX;
                        const newWidth = startWidth + deltaX;
                        const newPercent = (newWidth / rowWidth) * 100;
                        let newLength = Math.round((newPercent / 100) * totalSteps);
                        if (newLength < 1) newLength = 1;
                        if (block.start + newLength > totalSteps) newLength = totalSteps - block.start;

                        block.length = newLength;
                        blockEl.style.width = `${newLength * cellWidthPercent}%`;
                    }

                    function onMouseUp() {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                        renderBlocks(trackId);
                    }

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });

                row.appendChild(blockEl);
            });
        }

        document.addEventListener('dragover', (e) => {
            if (e.target.closest('.timeline-row')) e.preventDefault();
        });

        document.addEventListener('drop', (e) => {
            const row = e.target.closest('.timeline-row');
            if (row) {
                e.preventDefault();
                const index = Number(e.dataTransfer.getData('text/plain'));
                const trackId = e.dataTransfer.getData('track');
                const rect = row.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = (x / rect.width) * 100;
                const newStep = Math.round((percent / 100) * totalSteps);

                if (!isNaN(index) && patterns[trackId][index]) {
                    patterns[trackId][index].start = Math.max(0, Math.min(newStep, totalSteps - patterns[trackId][index].length));
                    renderBlocks(trackId);
                }
            }
        });

        buildInterface();

        const bpmSlider = document.getElementById('bpmSlider');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const playBtn = document.getElementById('playBtn');
        const playhead = document.getElementById('playhead');

        bpmSlider.addEventListener('input', (e) => {
            bpmDisplay.textContent = e.target.value;
            tempo = Number(e.target.value);
        });

        function playStep() {
            if (!isPlaying) return;
            const now = audioCtx.currentTime;
            const percent = (currentTime / totalSteps) * 100;
            playhead.style.left = `${percent}%`;

            tracks.forEach(track => {
                const blocks = patterns[track.id];
                blocks.forEach(block => {
                    if (currentTime >= block.start && currentTime < block.start + block.length) {
                        if (currentTime === block.start || (block.length > 1 && track.id !== 'kick' && track.id !== 'snare' && track.id !== 'hihat')) {
                            playSound(track.id, now);
                        }
                    }
                });
            });

            currentTime = (currentTime + 1) % totalSteps;
            const interval = (60 / tempo / 4) * 1000;
            timerID = setTimeout(playStep, interval);
        }

        playBtn.addEventListener('click', () => {
            initAudio();
            if (isPlaying) {
                isPlaying = false;
                playBtn.textContent = '▶ ПРОСЛУШАТЬ';
                playBtn.classList.remove('playing');
                clearTimeout(timerID);
                playhead.style.left = '0%';
                currentTime = 0;
            } else {
                isPlaying = true;
                currentTime = 0;
                playBtn.textContent = '■ СТОП';
                playBtn.classList.add('playing');
                playStep();
            }
        });

        // --- ЗАГРУЗКА ДЛЯ РЕДАКТИРОВАНИЯ ---
        async function loadBeatForEdit() {
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit');
            if (!editId) return;

            try {
                const response = await fetch(`/api/beats/single/${editId}`);
                if (!response.ok) throw new Error('Бит не найден');
                const beat = await response.json();
                
                document.getElementById('beatName').value = beat.name;
                document.getElementById('beatGenre').value = beat.genre;
                document.getElementById('bpmSlider').value = beat.bpm;
                document.getElementById('bpmDisplay').textContent = beat.bpm;
                tempo = Number(beat.bpm);
                
                if (beat.pattern_json) patterns = JSON.parse(beat.pattern_json);
                else if (beat.instruments_json) patterns = JSON.parse(beat.instruments_json);
                
                buildInterface();
                
                const saveBtn = document.getElementById('saveBeatBtn');
                saveBtn.textContent = 'Обновить бит';
                saveBtn.dataset.editId = editId;
            } catch (error) {
                console.error(error);
                alert('Не удалось загрузить бит для редактирования.');
            }
        }
        document.addEventListener('DOMContentLoaded', loadBeatForEdit);

        // --- СОХРАНЕНИЕ / ОБНОВЛЕНИЕ ---
        document.getElementById('saveBeatBtn').addEventListener('click', async () => {
            const name = document.getElementById('beatName').value;
            const genre = document.getElementById('beatGenre').value;
            const bpm = Number(bpmSlider.value);
            const saveBtn = document.getElementById('saveBeatBtn');
            const editId = saveBtn.dataset.editId;

            if (!name) {
                alert('Введите название бита!');
                return;
            }

            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const userId = currentUser ? Number(currentUser.id) : 1;

            const bodyData = { 
                name: name, genre: genre, bpm: bpm, 
                instruments: patterns, pattern: patterns, user_id: userId
            };

            try {
                let response;
                if (editId) {
                    response = await fetch(`/api/beats/${editId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData)
                    });
                } else {
                    response = await fetch('/api/beats', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData)
                    });
                }
                
                const data = await response.json();

                if (response.ok) {
                    alert(editId ? 'Бит обновлен!' : 'Бит успешно сохранен!');
                    window.location.href = '/dashboard.html'; 
                } else {
                    alert('Ошибка сервера: ' + data.error);
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        });
    </script>
    <script src="/js/footer.js"></script>
</body>
</html>
